spring.application.name=ms-usuarios
server.port=8081

# H2 en archivo: los datos se conservan entre ejecuciones (carpeta data/)
spring.datasource.url=jdbc:h2:file:./data/usuarios_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crea o actualiza las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update

# Consola web de H2 para ver las tablas (opcional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console